name: BrightPath read-only deployed backend audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public deployed assets (no credentials)
        run: python3 scripts/check-deployed-backends.py
