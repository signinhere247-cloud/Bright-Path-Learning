name: Standalone browser validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/browser-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-validation.yml'
    branches:
      - main
permissions:
  contents: read
jobs:
  browser:
    name: Production browser checks (${{ matrix.device }})
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 32
    # Desktop and mobile checks run separately; artifacts capture failing stages.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production site for browser testing
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production browser checks (${{ matrix.device }})
        run: timeout --signal=TERM --kill-after=10s 1500s npm run test:browser:production
        env:
          BRIGHTPATH_BROWSER_MODE: production
          BRIGHTPATH_BROWSER_DEVICE: ${{ matrix.device }}
          BRIGHTPATH_TEST_ARTIFACTS: test-artifacts/browser-${{ matrix.device }}
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brightpath-browser-validation-${{ matrix.device }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
