name: Standalone browser validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/browser-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-validation.yml'
    branches:
      - main
permissions:
  contents: read
jobs:
  browser:
    name: Production browser checks only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Desktop and mobile checks run separately; artifacts capture failing stages.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production site for browser testing
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop production browser checks (maximum 5 minutes)
        run: timeout --signal=TERM --kill-after=10s 300s npm run test:browser:production
        env:
          BRIGHTPATH_BROWSER_MODE: production
          BRIGHTPATH_BROWSER_DEVICE: desktop
          BRIGHTPATH_TEST_ARTIFACTS: test-artifacts/browser-desktop
      - name: Run mobile production browser checks (maximum 5 minutes)
        if: success()
        run: timeout --signal=TERM --kill-after=10s 300s npm run test:browser:production
        env:
          BRIGHTPATH_BROWSER_MODE: production
          BRIGHTPATH_BROWSER_DEVICE: mobile
          BRIGHTPATH_TEST_ARTIFACTS: test-artifacts/browser-mobile
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brightpath-browser-validation
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
